name: Publish Wishes & Ribbons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check gift selection and order logic
        run: node --test tests/order.test.cjs tests/shop.test.cjs
      - name: Check message, review and confirmation controls
        run: node tests/prd-dom-smoke.cjs
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_SETUP_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_SETUP_TOKEN != '' }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
