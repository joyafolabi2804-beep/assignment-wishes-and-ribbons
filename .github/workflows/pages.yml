name: Publish website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build static website
        run: npm run build:pages
      - name: Verify static output
        run: node scripts/verify-pages.mjs
      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Pages must be enabled once in Settings > Pages > GitHub Actions.
      # An optional administrator token can perform that initial setup instead.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_SETUP_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_SETUP_TOKEN != '' }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
